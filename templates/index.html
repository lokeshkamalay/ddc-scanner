<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice Barcode Lookup</title>
<style>
  :root { color-scheme: light dark; --accent:#0b6bcb; --bg:#f4f6f9; --card:#fff; --muted:#5a6570; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#15202b; }
  header { background:var(--accent); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.85; }
  main { max-width:960px; margin:0 auto; padding:20px; }
  .scan { background:var(--card); border-radius:12px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .scan label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin-bottom:8px; }
  #code { width:100%; font-size:26px; padding:14px 16px; border:2px solid #cfd8e3; border-radius:10px; letter-spacing:1px; }
  #code:focus { outline:none; border-color:var(--accent); }
  .hint { font-size:12px; color:var(--muted); margin-top:8px; }
  #status { margin:16px 0 8px; font-size:14px; font-weight:600; min-height:20px; }
  .card { background:var(--card); border-radius:12px; padding:16px 18px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.06); border-left:6px solid var(--accent); }
  .card.warn { border-left-color:#e08c00; }
  .card h2 { margin:0 0 4px; font-size:18px; }
  .highlights { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:14px 0; }
  .highlight { background:#e7f1fd; border-left:3px solid var(--accent); padding:10px 12px; min-width:0; }
  .highlight span { display:block; color:var(--muted); font-size:12px; font-weight:600; }
  .highlight strong { display:block; color:#134b82; font-size:18px; overflow-wrap:anywhere; }
  @media (max-width:600px) { .highlights { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td { padding:6px 0; border-bottom:1px solid #eef1f5; vertical-align:top; }
  td.k { color:var(--muted); width:150px; font-weight:600; }
  .err { color:#b3261e; }
  button { background:var(--accent); color:#fff; border:0; padding:10px 16px; border-radius:8px; font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Invoice Barcode Lookup</h1>
  <p>{{ source }} &middot; {{ item_count }} line items loaded</p>
</header>
<main>
  <section class="scan">
    <label for="code">Scan barcode / type item code or product name</label>
    <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scan now&hellip;" autofocus>
    <div class="hint">The box stays focused automatically. Press <b>Enter</b> to search, <b>Esc</b> to clear.</div>
  </section>
  <div id="status"></div>
  <div id="results"></div>
</main>
<script>
const input = document.getElementById('code');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function row(k, v) {
  return v ? `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>` : '';
}

function card(item, warn) {
  const qty = item.pack_size_text || 'Not specified';
  return `<div class="card ${warn ? 'warn' : ''}">
    <h2>${esc(item.item_code)} &mdash; ${esc(item.description)}</h2>
    <div class="highlights">
      <div class="highlight"><span>Price</span><strong>${esc(item.price)}</strong></div>
      <div class="highlight"><span>Shipped</span><strong>${esc(item.shipped)}</strong></div>
      <div class="highlight"><span>Quantity per case</span><strong>${esc(qty)}</strong></div>
    </div>
    <table>
      ${row('SN', item.sn)}
      ${row('Item code', item.item_code)}
      ${row('Description', item.description)}
      ${row('UPC', item.upc)}
      ${row('Barcode', item.barcode)}
      ${row('Amount', item.amount)}
      ${row('Source file', item.source_pdf)}
    </table>
  </div>`;
}

async function search(code) {
  statusEl.textContent = 'Searching\u2026';
  resultsEl.innerHTML = '';
  try {
    const res = await fetch('/api/lookup?code=' + encodeURIComponent(code));
    const data = await res.json();
    if (!res.ok) { statusEl.innerHTML = `<span class="err">${esc(data.error || 'Search failed')}</span>`; return; }
    if (!data.count) {
      statusEl.innerHTML = `<span class="err">No match for "${esc(code)}"</span>`;
      return;
    }
    const warn = data.match_type !== 'exact';
    statusEl.textContent = warn
      ? `${data.count} text match(es) for "${code}" (no exact barcode hit)`
      : `${data.count} match(es) for barcode ${code}`;
    resultsEl.innerHTML = data.results.map(i => card(i, warn)).join('');
  } catch (e) {
    statusEl.innerHTML = '<span class="err">Network error &mdash; is the server running?</span>';
  }
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const v = input.value.trim();
    if (v) search(v);
    input.select();
  } else if (e.key === 'Escape') {
    input.value = '';
    statusEl.textContent = '';
    resultsEl.innerHTML = '';
  }
});

// Keep the scanner's keystrokes landing in the input at all times.
document.addEventListener('click', () => input.focus());
setInterval(() => { if (document.activeElement !== input) input.focus(); }, 1000);
</script>
</body>
</html>
